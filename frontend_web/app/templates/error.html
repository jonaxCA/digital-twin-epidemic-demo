{# Rescatada de main y adaptada al diseño de Sprint-Monolitico. #}
{% extends "base_app.html" if current_user else "base_public.html" %}
{% block title %}{{ codigo }}{% endblock %}
{% block content %}
<div class="stub-page">
  <h2>{{ codigo }} · {{ titulo }}</h2>
  <p>{{ mensaje }}</p>
  <p><a class="btn btn-primary" href="{{ url_for('main.dashboard' if current_user else 'main.dashboard_publico') }}">Volver al panorama</a></p>
</div>
{% endblock %}
